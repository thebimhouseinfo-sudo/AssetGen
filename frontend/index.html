<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>AssetGen</title></head>
  <body>
    <div id="root"></div>
    <script>
      if (location.protocol === 'file:') {
        const root = document.getElementById('root');
        root.style.cssText = 'font: 16px system-ui; max-width: 560px; margin: 15vh auto; padding: 24px; line-height: 1.6;';
        root.textContent = 'AssetGen cần được mở qua ứng dụng local. ';
        const link = document.createElement('a');
        link.href = 'http://127.0.0.1:5173/';
        link.textContent = 'Mở AssetGen';
        root.appendChild(link);
        document.currentScript.nextElementSibling.remove();
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
